<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="first">DOM Manipulation Example</h1>
    <h2 id="second">undrstanding th DOM</h2>

    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>

    <div id="mbox" class="box">Box 1
        <span style="display: none;">Learning</span>
        <p>end...</p>
    </div>

    <script>
        let f1 = document.getElementById('mbox');
        console.log(f1.textContent);
        console.log(f1.innerText);
        console.log(f1.innerHTML);
        console.log("====================================");
        
        const myh1 = document.getElementById('first');
        console.log(myh1);        
        console.log(myh1.textContent);
        
        myh1.textContent="We are Learning DOM."
        myh1.style.color='blue';
        myh1.style.fontSize='50px';
        myh1.style.backgroundColor='lightgrey';
        console.log("====================================");

        const myb1 = document.getElementsByTagName('body');
        console.log(myb1);
        myb1[0].style.backgroundColor = 'lightblue';
    </script>
</body>
</html>
